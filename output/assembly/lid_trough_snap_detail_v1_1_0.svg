<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#111827">Detail: aktive Schnapperseite</text>
  <text x="24" y="58" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">Schnittprinzip im X-Z: starre Trogwand, elastische Rastnase am Deckel.</text>
  <polygon points="396.0,142.0 412.5,142.0 412.5,10.8 396.0,10.8" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <polygon points="396.0,77.5 412.5,77.5 412.5,71.5 396.0,71.5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="388.5,10.8 396.0,10.8 396.0,87.2 403.5,76.0 403.5,73.0 396.0,52.0 396.0,10.8" fill="#93c5fd" fill-opacity="0.35" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="381.2,10.8 388.7,10.8 388.7,87.2 396.2,76.0 396.2,73.0 388.7,52.0 388.7,10.8" fill="#60a5fa" fill-opacity="0.90" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="347" y1="136" x2="305" y2="136" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="362" y="141" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">Elastische X-Auslenkung ~1.0 mm</text>
  <text x="24" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">Hellblau gestrichelt: freie Rastnase vor Kontakt</text>
  <text x="24" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">Blau: eingefederte Rastnase während des Eindrückens</text>
  <text x="24" y="136" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">Nach der Slotkante springt die Nase wieder nach außen.</text>
</svg>
